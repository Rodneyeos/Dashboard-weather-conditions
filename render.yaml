services:
  - type: web
    name: awekas-weather-control
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: awekas-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: POLL_SECONDS
        value: '60'
      - key: COOKIE_SECURE
        value: 'true'
      - key: DB_PATH
        value: /data/weather.sqlite3
